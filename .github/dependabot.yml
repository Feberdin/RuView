# Purpose: Keep every lockfile-owning package family in this monorepo under
# automated, reviewable dependency maintenance.
# Input/output: Dependabot reads manifests from the listed directories and
# opens pull requests; it never receives application secrets from this file.
# Invariant/debugging: when a tracked lockfile is added, add its directory here
# and to dependency-security.yml in the same pull request.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, github-actions]

  - package-ecosystem: npm
    directories:
      - /dashboard
      - /examples/frontend
      - /harness/homecore
      - /harness/ruview
      - /integrations/iphone-lidar/web
      - /tools/ruview-cli
      - /tools/ruview-mcp
      - /ui/mobile
      - /v2/crates/wifi-densepose-desktop/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    labels: [dependencies, javascript]
    groups:
      same-dependency-across-packages:
        group-by: dependency-name

  - package-ecosystem: cargo
    directories:
      - /python
      - /v2
      - /v2/crates/homecore-plugin-example
      - /v2/crates/wifi-densepose-physics/fuzz
      - /v2/crates/wifi-densepose-wasm-edge
      - /v2/patches/ruvector-crv
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    labels: [dependencies, rust]
    groups:
      same-dependency-across-lockfiles:
        group-by: dependency-name

  - package-ecosystem: pip
    directories:
      - /
      - /aether-arena/space
      - /archive/v1
      - /python
      - /python/ruview-meta
      - /python/tombstone
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    labels: [dependencies, python]
    groups:
      same-dependency-across-projects:
        group-by: dependency-name

  - package-ecosystem: docker
    directories:
      - /docker
      - /v2/crates/nvsim-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, docker]
