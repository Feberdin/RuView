version: 2
updates:
  # Keep all third-party GitHub Actions on verified, pinned commit SHAs.
  # Pairs with the SHA pinning in security-scan.yml and ci.yml so that
  # future bumps stay automated and reviewable rather than drifting back
  # to mutable @master / @main refs. See issue #442.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions

  # Mobile app npm deps. Includes the @xmldom/xmldom, node-forge, and
  # picomatch advisories from #442 plus axios and any future surface.
  - package-ecosystem: npm
    directory: /ui/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - mobile

  # Dependabot needs one entry per lockfile directory in a monorepo. This
  # single repository-level file controls all maintained packages below.
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - dashboard

  - package-ecosystem: npm
    directory: /examples/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend

  - package-ecosystem: npm
    directory: /tools/ruview-cli
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - cli

  - package-ecosystem: npm
    directory: /tools/ruview-mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - mcp

  # Desktop UI npm deps.
  - package-ecosystem: npm
    directory: /v2/crates/wifi-densepose-desktop/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - desktop

  # Python deps used by v1/ and the FastAPI service. requirements.txt is
  # only loosely pinned; let Dependabot surface upstream CVE bumps.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: pip
    directory: /python/ruview-meta
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: pip
    directory: /python/tombstone
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: pip
    directory: /aether-arena/space
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  # Rust workspace. CI additionally runs cargo-audit for every lockfile.
  - package-ecosystem: cargo
    directory: /v2
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust

  - package-ecosystem: cargo
    directory: /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust

  # Runtime and deployment container definitions.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /v2/crates/nvsim-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
