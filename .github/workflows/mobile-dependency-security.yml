# Purpose: Guard the reviewed ui/mobile dependency security overrides.
# Input: Mobile package metadata, lockfile, and the compatibility verifier.
# Output: A reproducible install plus version, runtime, and npm-advisory checks.
# Invariants/debugging:
#   - No deployment, registry publication, or repository secret is used.
#   - Expo and React Native are aligned; npm ci must reproduce the lockfile
#     without legacy peer-resolution exceptions.
#   - Reproduce locally from ui/mobile with the two commands below.

name: Mobile dependency security

on:
  pull_request:
    paths:
      - .github/workflows/mobile-dependency-security.yml
      - ui/mobile/package.json
      - ui/mobile/package-lock.json
      - ui/mobile/scripts/verify-dependency-security.cjs
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-dependency-security.yml
      - ui/mobile/package.json
      - ui/mobile/package-lock.json
      - ui/mobile/scripts/verify-dependency-security.cjs
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: mobile-dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-dependencies:
    name: Verify patched mobile dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui/mobile

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use the supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/mobile/package-lock.json

      # Why this exists: a plain npm ci proves that package.json and the
      # reviewed lockfile agree without bypassing peer-dependency validation.
      - name: Install the reviewed lockfile
        run: npm ci --ignore-scripts

      # Why this exists: it checks every reviewed override, representative real
      # consumers, and npm's live advisory result with actionable errors.
      - name: Verify dependency security and compatibility
        run: npm run test:dependency-security
