name: wifi-densepose sensing-server → GHCR (+ optional Docker Hub)

# Build + publish the `wifi-densepose` sensing-server image to Feberdin GHCR
# (`ghcr.io/feberdin/wifi-densepose`) and, when explicitly configured, to the
# authenticated Docker Hub account on:
#   - push to main affecting the Dockerfile, the server crate, the UI assets,
#     or this workflow itself,
#   - tag push matching v* (release builds),
#   - manual workflow_dispatch.
#
# Closes #520 and #514: the stale `:latest` is rebuilt and pushed automatically
# whenever the surface that produces it changes, and the Dockerfile fails the
# build if the observatory/pose-fusion UI assets ever go missing again.
#
# Optional secrets:
#   DOCKERHUB_USERNAME — Docker Hub login name owning `wifi-densepose`
#   DOCKERHUB_TOKEN    — Docker Hub access token with read/write scope
# If either secret is absent, Docker Hub is skipped without weakening the GHCR
# build, publication, or smoke tests. GHCR uses the scoped GITHUB_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - 'docker/Dockerfile.rust'
      - 'docker/docker-entrypoint.sh'
      - 'v2/crates/wifi-densepose-sensing-server/**'
      - 'v2/crates/wifi-densepose-signal/**'
      - 'v2/crates/wifi-densepose-vitals/**'
      - 'v2/crates/wifi-densepose-wifiscan/**'
      - 'v2/crates/wifi-densepose-bfld/**'
      - 'v2/crates/cog-ha-matter/**'
      - 'v2/Cargo.toml'
      - 'v2/Cargo.lock'
      - 'ui/**'
      - '.github/workflows/sensing-server-docker.yml'
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: sensing-server-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: build · push · smoke-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      # QEMU is required so the amd64 GitHub runner can cross-build the
      # linux/arm64 layer below (Dockerfile.rust is arch-agnostic — no `--target`
      # flag — so buildx + QEMU is all that's needed; arm64 builds are emulated
      # by the runner, not built on a separate arm64 host).
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # Why this exists: forks do not own the upstream `ruvnet` Docker Hub
      # namespace and must not fail merely because those optional credentials
      # are absent. GHCR in the Feberdin organization is always the canonical
      # target; Docker Hub is added only as an authenticated mirror.
      - name: Determine authorized registry targets
        id: targets
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          targets_file="${RUNNER_TEMP}/sensing-server-registry-targets.txt"
          printf '%s\n' 'ghcr.io/feberdin/wifi-densepose' > "${targets_file}"
          dockerhub_enabled=false

          if [[ -n "${DH_USER}" && -n "${DH_TOKEN}" ]]; then
            if [[ ! "${DH_USER}" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
              echo "Docker Hub publication is configured with an invalid username format." >&2
              echo "Use a lowercase Docker Hub account name containing only letters, numbers, '_' or '-'." >&2
              exit 1
            fi
            printf 'docker.io/%s/wifi-densepose\n' "${DH_USER}" >> "${targets_file}"
            dockerhub_enabled=true
            echo "Docker Hub mirror publication is enabled."
          elif [[ -n "${DH_USER}" || -n "${DH_TOKEN}" ]]; then
            echo "::warning::Docker Hub publication is skipped because only one of DOCKERHUB_USERNAME and DOCKERHUB_TOKEN is configured."
          else
            echo "Docker Hub publication is not configured; publishing to Feberdin GHCR only."
          fi

          {
            echo 'images<<REGISTRY_TARGETS'
            cat "${targets_file}"
            echo 'REGISTRY_TARGETS'
            echo "dockerhub_enabled=${dockerhub_enabled}"
          } >> "${GITHUB_OUTPUT}"

      - name: Log in to Docker Hub
        if: steps.targets.outputs.dockerhub_enabled == 'true'
        # Bypassing docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9: the action kept emitting
        # "malformed HTTP Authorization header" against a known-good
        # dckr_pat_* token (verified by direct curl against the Hub API).
        # `docker login --password-stdin` is the documented credential
        # path and avoids whatever encoding step the action injects.
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DH_TOKEN" | docker login docker.io -u "$DH_USER" --password-stdin

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build + push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: docker/Dockerfile.rust
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # README badge advertises `amd64 + arm64`, and #547 promised multi-arch
          # as part of the docker publish refresh; arm64 was never actually wired
          # in, so Apple Silicon Macs hit `no matching manifest for linux/arm64/v8`
          # on `docker pull ruvnet/wifi-densepose:latest` (#136, #625). Build both.
          platforms: linux/amd64,linux/arm64

      # ---------------------------------------------------------------------
      # Smoke-test the freshly-pushed image:
      #   1. UI assets that closed #520 are inside `/app/ui` (the Dockerfile's
      #      RUN guard catches missing ones at build time, this re-checks the
      #      pushed artifact post-hoc as belt-and-braces).
      #   2. /health is up.
      #   3. /api/v1/info returns 200 with no auth (LAN-mode default).
      #   4. With RUVIEW_API_TOKEN set, /api/v1/info returns 401 without a
      #      Bearer header, 200 with the correct one (the #443 auth middleware).
      # ---------------------------------------------------------------------
      - name: Smoke-test image assets + LAN-mode HTTP
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/feberdin/wifi-densepose:sha-${GITHUB_SHA::7}"
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" sh -c \
            'ls /app/ui/observatory.html /app/ui/pose-fusion.html /app/ui/index.html /app/ui/viz.html >/dev/null'
          docker run --rm "$IMAGE" sh -c 'ls -d /app/ui/observatory /app/ui/pose-fusion >/dev/null'

          docker run -d --name sm -p 3000:3000 -e CSI_SOURCE=simulated "$IMAGE"
          # Wait up to 30 s for /health.
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/health
          curl -fsS http://127.0.0.1:3000/api/v1/info >/dev/null
          curl -fsS http://127.0.0.1:3000/ui/observatory.html >/dev/null
          curl -fsS http://127.0.0.1:3000/ui/pose-fusion.html >/dev/null
          docker stop sm

      - name: Smoke-test the bearer-token auth path
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/feberdin/wifi-densepose:sha-${GITHUB_SHA::7}"
          TEST_AUTH_TOKEN="$(openssl rand -hex 32)"
          docker run -d --name auth \
            -p 3000:3000 \
            -e CSI_SOURCE=simulated \
            -e RUVIEW_API_TOKEN="$TEST_AUTH_TOKEN" \
            "$IMAGE"
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          # /health stays unauthenticated.
          curl -fsS http://127.0.0.1:3000/health >/dev/null
          # /api/v1/info without a bearer → 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/info)
          test "$code" = "401" || { echo "expected 401, got $code"; exit 1; }
          # Wrong bearer → 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://127.0.0.1:3000/api/v1/info)
          test "$code" = "401" || { echo "expected 401 (wrong token), got $code"; exit 1; }
          # Correct bearer → 200.
          curl -fsS -H "Authorization: Bearer ${TEST_AUTH_TOKEN}" http://127.0.0.1:3000/api/v1/info >/dev/null
          docker stop auth

      - name: Summary
        if: always()
        run: |
          {
            echo "## sensing-server image published and smoke-tested"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Feberdin GHCR is always published. Docker Hub is included only when both optional repository secrets are configured."
            echo "The Dockerfile fails the build if the required UI assets disappear, and the freshly published GHCR image is smoke-tested before this job succeeds."
          } >> "$GITHUB_STEP_SUMMARY"
