# Purpose: Build, smoke-test, and publish the exact RuView image used by Unraid.
# Input: The pushed commit on the dedicated deployment branch and the Unraid
#        Dockerfile/runtime sources listed in the path filter below.
# Output: One amd64 GHCR image tagged with the full Git commit SHA and reported
#         with its immutable registry digest.
# Invariants/debugging:
#   - Publishing happens only after the readiness smoke test succeeds.
#   - GITHUB_TOKEN is passed through stdin and is never printed.
#   - The workflow never deploys to Unraid; the Broker consumes the pinned
#     digest later through a separate reviewed Compose commit.
#   - Build and container logs identify the failing stage without secrets.

name: Publish RuView Unraid image

on:
  push:
    branches:
      - codex/ruview-docker-hardening
    paths:
      - .github/workflows/unraid-image-publish.yml
      - docker/Dockerfile.unraid
      - docker/docker-entrypoint.sh
      - ui/**
      - v2/Cargo.lock
      - v2/Cargo.toml
      - v2/crates/**
      - v2/vendor/**
      - vendor/midstream/**
      - vendor/rufield/**
      - vendor/ruvector/**
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ruview-unraid-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/feberdin/ruview-unraid
  LOCAL_IMAGE: ruview-unraid-candidate

jobs:
  publish:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Enable reproducible Docker builds
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      # Why this exists: the candidate must be locally runnable before any
      # registry mutation occurs. The revision label preserves provenance after
      # the later Compose commit pins this image by digest.
      - name: Build the exact amd64 candidate
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/Dockerfile.unraid
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.LOCAL_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      # Why this exists: a successful Rust compile does not prove that the
      # entrypoint, bundled UI, or readiness route works in the final image.
      - name: Verify candidate startup and readiness
        shell: bash
        run: |
          set -euo pipefail
          container_name="ruview-publish-${GITHUB_RUN_ID}"

          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${container_name}" \
            --env CSI_SOURCE=simulated \
            --env RUVIEW_ALLOW_UNAUTHENTICATED=1 \
            --publish 127.0.0.1:8300:3000 \
            "${LOCAL_IMAGE}:${GITHUB_SHA}"

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8300/health/ready >/dev/null; then
              echo "RuView readiness check succeeded on attempt ${attempt}."
              exit 0
            fi
            sleep 1
          done

          echo "RuView did not become ready within 60 seconds." >&2
          docker logs --tail 200 "${container_name}" >&2
          exit 1

      # Why this exists: Unraid cannot finish the cold Rust build inside the
      # Broker's hard timeout. Publishing only the already-tested local image
      # moves compilation to CI while preserving exact commit provenance.
      - name: Publish immutable full-SHA tag
        id: publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | \
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          exact_tag="${REGISTRY_IMAGE}:sha-${GITHUB_SHA}"
          docker tag "${LOCAL_IMAGE}:${GITHUB_SHA}" "${exact_tag}"
          push_log="${RUNNER_TEMP}/ruview-ghcr-push.log"
          docker push "${exact_tag}" | tee "${push_log}"

          digest="$(sed -nE \
            's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' \
            "${push_log}" | tail -n 1)"
          digest_ref="${REGISTRY_IMAGE}@${digest}"

          if [[ ! "${digest_ref}" =~ ^${REGISTRY_IMAGE}@sha256:[0-9a-f]{64}$ ]]; then
            echo "Published image digest could not be resolved." >&2
            exit 1
          fi

          echo "digest_ref=${digest_ref}" >> "${GITHUB_OUTPUT}"
          echo "Published immutable image: \`${digest_ref}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published immutable image: ${digest_ref}"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io >/dev/null 2>&1 || true
