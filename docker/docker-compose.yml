# Purpose: Unraid/Broker-friendly runtime stack for RuView's Rust sensing server.
# Input: Docker builds from the repository root and optional CSI_SOURCE/MODELS_DIR
#        environment values supplied by the operator.
# Output: One long-running HTTP/WebSocket/UDP sensing service. The legacy Python
#         WebSocket service is available only when the "python" profile is enabled.
# Invariants/debugging:
#   - Host ports must not collide with existing Unraid containers.
#   - ESP32 CSI UDP stays on host port 5005 so sensor firmware does not need a
#     deployment-specific target-port change.
#   - Logs are bounded; inspect them through the Unraid Deployment Broker first.

version: "3.9"

services:
  sensing-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rust
    image: ruvnet/wifi-densepose:latest
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # Host ports 3000 and 8080 are commonly used on Unraid. Use the 830x
      # range so this stack can run beside Gotenberg, SecondBrain, and other apps.
      - "8300:3000"   # REST API and bundled UI
      - "8301:3001"   # WebSocket
      # ESP32 UDP. On Linux/macOS this works with multiple ESP32 nodes out of
      # the box. On Docker Desktop for Windows, multi-source UDP is collapsed
      # to one source IP at the WSL/Hyper-V boundary, so all-but-one node's
      # frames are silently dropped (issue #374, #386).
      #
      # Windows workaround: change this to "5006:5005/udp" and run the host
      # relay so every datagram arrives from the same loopback source:
      #
      #   python scripts/udp-relay.py --listen-port 5005 --forward-port 5006
      #
      # See docs/TROUBLESHOOTING.md §9 for details.
      - "5005:5005/udp"
    environment:
      - RUST_LOG=info
      # CSI_SOURCE controls the data source for the sensing server.
      # Options: auto (default) — probe for ESP32 UDP then fall back to simulation
      #          esp32          — receive real CSI frames from an ESP32 on UDP port 5005
      #          wifi           — use host Wi-Fi RSSI/scan data (Windows netsh)
      #          simulated      — generate synthetic CSI data (no hardware required)
      - CSI_SOURCE=${CSI_SOURCE:-auto}
      # MODELS_DIR controls where the server scans for .rvf model files.
      # Mount a host directory and set this to make models visible:
      #   volumes: ["/path/to/models:/app/models"]
      #   MODELS_DIR=/app/models
      - MODELS_DIR=${MODELS_DIR:-data/models}
    # No explicit command needed — docker-entrypoint.sh uses CSI_SOURCE.
    # Override with: command: ["--source", "esp32", "--tick-ms", "500"]

  python-sensing:
    profiles:
      - python
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    image: ruvnet/wifi-densepose:python
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8765:8765"   # WebSocket
      - "8302:8080"   # UI, if a Python UI server is enabled later
    environment:
      - PYTHONUNBUFFERED=1
