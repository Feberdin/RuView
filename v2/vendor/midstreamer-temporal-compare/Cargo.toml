# Purpose: Build the reviewed temporal-comparison crate with a memory-safe LRU release.
# Input/Output: Rust sequences in; comparison metrics and cached results out.
# Invariants: Keep the public 0.2.1 API compatible and lru at 0.18.2 or newer.
# Debugging: From v2/, run `cargo test --manifest-path vendor/midstreamer-temporal-compare/Cargo.toml`.

[package]
name = "midstreamer-temporal-compare"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "Temporal sequence comparison and pattern matching"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ruvnet/midstream"
keywords = ["temporal", "sequence", "comparison", "pattern-matching", "midstream"]
categories = ["algorithms", "data-structures"]

[lib]
name = "midstreamer_temporal_compare"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
dashmap = "6.1"
lru = "0.18.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
